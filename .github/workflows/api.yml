name: API

on:
  pull_request:
    paths: ['api/**', 'Dockerfile', 'site/app/**', 'site/build.sh']
  push:
    branches: [main]
    paths: ['api/**', 'Dockerfile', 'site/app/**', 'site/build.sh']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vault" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: psql "postgresql://vault:vault@localhost/postgres" -c "ALTER USER vault CREATEDB"
      - run: dotnet test api/tests/VaultApi.Tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vault .
